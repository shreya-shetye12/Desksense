[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desksense"
version = "0.1.0"
description = "Reproducible video interaction recognition and evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "torch>=2.4,<3", "torchvision>=0.19,<1",
  "transformers>=4.46,<5", "opencv-python-headless>=4.10,<5",
  "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "safetensors>=0.4,<1", "requests>=2.32,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[project.scripts]
desksense = "desksense.cli:main"
[tool.setuptools.packages.find]
include = ["desksense*"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
desksense = ["web/*.html", "web/*.css", "web/*.js"]
